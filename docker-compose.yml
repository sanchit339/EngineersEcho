services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engineersecho}
      POSTGRES_USER: ${POSTGRES_USER:-engineersecho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engineersecho_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-engineersecho}
      POSTGRES_USER: ${POSTGRES_USER:-engineersecho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engineersecho_password}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
  media_data:
